    <!-- Suppress source map errors from browser extensions -->
    <script>
      // Suppress source map parsing errors from browser extensions
      const originalError = console.error;
      console.error = function (...args) {
        const message = args[0]?.toString() || '';
        // Filter out source map errors from browser extensions
        if (
          message.includes('JSON.parse: unexpected character') &&
          (message.includes('source-map') || message.includes('.map'))
        ) {
          return; // Suppress these errors
        }
        originalError.apply(console, args);
      };
    </script>
